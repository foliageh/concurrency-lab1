name: Java CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Amazon Corretto 25
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup and Run Gradle Check
        uses: gradle/actions/setup-gradle@v6
        with:
          arguments: check --no-build-cache